# Forecast configuration

[location]
name = Cape St Francis
latitude = -34.25
longitude = 24.90
# The tide grid needs an offshore point to avoid null land cells.
tide_latitude = -34.25
tide_longitude = 24.90
timezone = Africa/Johannesburg

[forecast]
# Number of days to show (1-10).
days = 7

[display]
# Pixel size of the location name in the header.
location_text_size = 18

[graphs]
# Minimum Y-axis top. Each graph expands automatically if the data is higher.
wind_max = 40
swell_max = 5
